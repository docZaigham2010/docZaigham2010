<!doctype html>
<html><head><meta charset="utf-8"><title>Mock app (pipeline test)</title>
<style>
body{margin:0;font:15px system-ui,sans-serif;background:#f1f5f9;color:#0f172a}
.auth{display:grid;place-items:center;height:100vh;background:#1e293b}
.auth form{background:#fff;padding:48px;border-radius:12px;width:380px;display:grid;gap:14px}
input{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
button{padding:12px 18px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-weight:600}
.shell{display:flex;height:100vh}
aside{width:260px;background:#0f172a;padding:24px 12px}
aside a{display:block;color:#cbd5e1;padding:12px 16px;border-radius:8px;text-decoration:none}
aside a:hover{background:#1e293b}
main{flex:1;overflow-y:auto;padding:40px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:#fff;border-radius:12px;padding:24px;height:120px;box-shadow:0 1px 3px #0001}
table{width:100%;background:#fff;margin-top:24px;border-radius:12px;border-collapse:collapse}
td{padding:14px;border-bottom:1px solid #e2e8f0}
</style></head><body><div id="app"></div>
<script>
const app = document.getElementById('app');
function render() {
  const route = location.hash.slice(1) || '/authentication/sign-in';
  if (!localStorage.token && !route.startsWith('/authentication')) { location.hash = '#/authentication/sign-in'; return; }
  if (route.startsWith('/authentication')) {
    app.innerHTML = `<div class="auth"><form><h2>Sign in</h2><input type="email" placeholder="Email"><input type="password" placeholder="Password"><button type="submit">Sign in</button></form></div>`;
    app.querySelector('form').onsubmit = e => { e.preventDefault(); localStorage.token = 'x'; location.hash = '#/dashboard'; };
    return;
  }
  const name = route.split('/')[1];
  const nav = ['dashboard', 'reviews', 'clients', 'reports', 'settings'].map(n => `<a href="#/${n}">${n[0].toUpperCase() + n.slice(1)}</a>`).join('');
  const rows = Array.from({ length: 30 }, (_, i) => `<tr><td>${name} item ${i + 1}</td><td>Pending</td><td>${i * 3}%</td></tr>`).join('');
  app.innerHTML = `<div class="shell"><aside>${nav}<a href="#/authentication/sign-out">Sign out</a></aside><main><h1>${name}</h1><div class="grid"><div class="card">A</div><div class="card">B</div><div class="card">C</div><div class="card">D</div></div><table><tbody>${rows}</tbody></table></main></div>`;
}
addEventListener('hashchange', render); render();
</script></body></html>
