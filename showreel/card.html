<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Showreel card</title>
<style>
  @font-face { font-family: Hanken; src: url(fonts/Hanken-400.ttf); font-weight: 400; }
  @font-face { font-family: Hanken; src: url(fonts/Hanken-600.ttf); font-weight: 600; }
  @font-face { font-family: Hanken; src: url(fonts/Hanken-700.ttf); font-weight: 700; }
  @font-face { font-family: Display; src: url(fonts/SS4Display-300.ttf); font-weight: 300; }
  @font-face { font-family: Display; src: url(fonts/SS4Display-Italic-400.ttf); font-style: italic; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0f1a; }
  .stage {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; padding: 0 220px; color: #f4f1ea;
    background:
      radial-gradient(1200px 700px at 78% 30%, rgba(var(--accent), .22), transparent 60%),
      radial-gradient(900px 600px at 10% 90%, rgba(var(--accent), .10), transparent 60%),
      #0b0f1a;
  }
  .grain { position: absolute; inset: 0; opacity: .06; background-image: repeating-radial-gradient(circle at 17% 23%, #fff 0 1px, transparent 1px 3px); }
  .kicker {
    font: 600 26px/1 Hanken, sans-serif; letter-spacing: .32em; text-transform: uppercase;
    color: rgb(var(--accent)); display: flex; align-items: center; gap: 28px;
  }
  .kicker::after { content: ""; height: 2px; width: 0; background: rgb(var(--accent)); transition: width 1.4s cubic-bezier(.2,.7,.1,1) .3s; }
  .title { font: 300 132px/1.02 Display, Georgia, serif; margin: 34px 0 30px; letter-spacing: -.01em; max-width: 1400px; }
  .line { font: italic 400 44px/1.35 Display, Georgia, serif; color: #c9c4b8; max-width: 1250px; }
  .foot { position: absolute; left: 220px; bottom: 90px; font: 400 22px/1 Hanken, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #7d7a72; }
  .kicker, .title, .line, .foot { opacity: 0; transform: translateY(26px); transition: opacity 1s ease, transform 1.2s cubic-bezier(.2,.7,.1,1); }
  .go .kicker { opacity: 1; transform: none; }
  .go .kicker::after { width: 180px; }
  .go .title { opacity: 1; transform: none; transition-delay: .25s; }
  .go .line { opacity: 1; transform: none; transition-delay: .7s; }
  .go .foot { opacity: 1; transform: none; transition-delay: 1.1s; }
  .go .stage { animation: drift 8s linear forwards; }
  @keyframes drift { from { background-position: 0 0, 0 0; } to { background-position: -60px 20px, 40px -20px; } }
</style>
</head>
<body>
<div class="stage">
  <div class="grain"></div>
  <div class="kicker" id="kicker"></div>
  <div class="title" id="title"></div>
  <div class="line" id="line"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  for (const k of ['kicker', 'title', 'line', 'foot']) document.getElementById(k).textContent = p.get(k) || '';
  document.documentElement.style.setProperty('--accent', p.get('accent') || '232, 178, 92');
  window.play = () => document.body.classList.add('go');
</script>
</body>
</html>
